[project]
name = "meshtastic-visualizer"
version = "1.8.6"
description = "Qt desktop application to send messages, inspect packets, metrics from your Meshtastic node."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=45.0.3",
    "folium==0.17.0",
    "importlib-resources>=6.5.2",
    "meshtastic==2.7.4",
    "paho-mqtt>=2.1.0",
    "protobuf==5.27.3",
    "pubsub==0.1.2",
    "pyqt6==6.8",
    "pyqt6-webengine==6.7",
    "pyqtgraph>=0.13.7",
    "pyserial==3.5",
    "dbus-python>=1.4.0",
    "plyer>=2.1.0",
]

[tool.uv]
package = true


[tool.ruff]
# Set the maximum line length to 79.
line-length = 200

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[tool.setuptools]
packages = ["meshtastic_visualizer"]

[project.gui-scripts]
meshtastic_visualizer = "meshtastic_visualizer:main"

